name: check-report

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the committed example report
        run: node scripts/check-report.mjs examples/tiny-app/reports/codebase-map/tiny-app
