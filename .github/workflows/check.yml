name: check-report

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Check the example report
        run: cargo run --release --bin check-report -- examples/tiny-app/reports/codebase-map/tiny-app
      - name: Speed of the 200-node report
        run: cargo test --release --test speed -- --nocapture
